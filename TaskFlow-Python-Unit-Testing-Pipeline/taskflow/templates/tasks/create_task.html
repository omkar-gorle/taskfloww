{% extends "base.html" %}{% block content %}<div class="container py-5"><div class="form-panel"><span class="eyebrow">NEW TASK</span><h2 class="fw-bold mb-4">Create a task</h2><form method="post">
<div class="row g-3"><div class="col-12"><label class="form-label">Task title</label><input class="form-control" name="title" maxlength="150" required value="{{task.title if task else ''}}"></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{task.description if task else ''}}</textarea></div>
<div class="col-md-4"><label class="form-label">Category</label><select class="form-select" name="category">{% for x in ['Work','Study','Personal','Health','Other'] %}<option {% if task and task.category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Priority</label><select class="form-select" name="priority">{% for x in ['Low','Medium','High'] %}<option {% if task and task.priority==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Due date</label><input class="form-control" type="date" name="due_date" value="{{task.due_date.isoformat() if task and task.due_date else ''}}"></div></div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Create task</button><a class="btn btn-outline-secondary" href="{{url_for('tasks.list_tasks')}}">Cancel</a></div></form></div></div>{% endblock %}
